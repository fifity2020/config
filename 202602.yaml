# 1. 基础设置
mixed-port: 7890
allow-lan: true
provider-proxy: 🚀 默认代理
bind-address: '*'             # 💡 旁路由全接口监听
ipv6: false                   # 💡 彻底关闭IPv6，消除双栈握手延迟
log-level: info
unified-delay: true
tcp-concurrent: true

 # 2. TUN 模式
tun:
  enable: true
  stack: mixed              
  mtu: 1400                 
  auto-route: false
  auto-redirect: false
  auto-detect-interface: false
  dns-hijack:
     - "any:53"

# 3. DNS (参考机场的高性能并发设置)
dns:
  enable: true
  cache-algorithm: arc
  listen: 0.0.0.0:1053
  ipv6: false
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 28.0.0.1/8
  fake-ip-filter-mode: blacklist
 
  fake-ip-filter:
    - "*.lan"
    - "*.localdomain"
    - "*.example"
    - "*.invalid"
    - "*.localhost"
    - "*.test"
    - "*.local"
    - "*.home.arpa"
    - "time.*.com"
    - "time.*.apple.com"
    - "ntp.*.com"
    - "*.ntp.org.cn"
    - "+.pool.ntp.org"
    - "stun.*.*"
    - "music.163.com"
    - "*.music.163.com"
    - "www.bilibili.com"
    - "api.bilibili.com"
    - "rule-set:fakeipfilter_domain"

  default-nameserver:
   - 119.29.29.29            # 🔍 改成纯 IP (UDP)。瞬间解决软路由启动死循环、电视盒子有线报错
   - 223.5.5.5

  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query

  direct-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query

  nameserver:
    - https://doh.pub/dns-query       # 🔍 新增这一行！国内主力加密 DNS，让国内和亚太 IPTV 秒开、零卡顿
    - https://8.8.8.8/dns-query#RULES&ecs=223.5.5.0/24  
    -  223.5.5.5
    # 保留这条给国外流媒体和机场用4
  hosts:
    'cache.ott.fifalive.itv.cmvideo.cn': 39.134.195.181
    'studentlive.migucloud.com' : '39.134.142.147' 
    'proxmox.local': '192.168.20.2'
    'openwrt.lan': '192.168.20.2'     

# 4. sniffer设置
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
         ports: [443, 8443]
    QUIC:                     
         ports: [443, 8443]
  skip-domain:
    - 'Mijia Cloud'
    - '+.apple.com'
    - '+.qq.com'
    - '+.baidu.com'
    - 'rule-set:cn_domain'


# 5. 机场订阅
proxy-providers:
  Airport1:
    url: "我的订阅" 
    type: http
    interval: 7200
    path: ./proxies/airport1.yaml
    health-check: {enable: true, url: "http://www.gstatic.com/generate_204", interval: 600}

# 6. 代理分组 (包含家宽识别与故障转移)
proxy-groups:
  - name: ☁️cloudflare
    type: url-test          # 自动选择延迟最低的
    url: 'https://cp.cloudflare.com/generate_204'
    interval: 300
    use:
      - Airport1            # 对应 provider      
    filter: "proxy"         # 关键：抓取所有名字里带 "proxy" 的节点
  
  - name: 📺 4GTV专用
    type: select
    use:
      - Airport3
    filter: "(?i)台湾|TW|Taiwan|🇹🇼"

  # ================= 1. 业务决策组 (实现无感切换) =================
