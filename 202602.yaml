  # ================= 2. 故障转移组 (🔯 Fallback) =================
  - {name: 🔯 香港故转, type: fallback, include-all: true, lazy: false, interval: 120, url: "https://www.gstatic.com/generate_204", filter: "(?i)^(?!.*[2-9]x).*(Hong|HK|香港)"}
  - {name: 🔯 台湾故转, type: fallback, include-all: true, lazy: false, interval: 120, url: "https://www.gstatic.com/generate_204", filter: "(?i)Taiwan|TW|台湾"}
  - {name: 🔯 日本故转, type: fallback, include-all: true, lazy: false, interval: 120, url: "https://www.gstatic.com/generate_204", filter: "(?i)Japan|JP|日本"}
