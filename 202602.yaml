  - {name: 🛠️ CF通道, type: fallback, use: [Airport1], url: 'https://www.gstatic.com/generate_204', interval: 300}
# ================= 3. 自动优选组 (♻️ URL-Test - 换用 CF 真实测速源) =================
# 稍微把 interval 缩短到 100s，更灵敏地抓取晚高峰波动
  - {name: ♻️ 香港自动, type: url-test, include-all: true, lazy: false, interval: 100, tolerance: 30, url: "https://www.gstatic.com/generate_204", filter: "(?i)^(?!.*[2-9]x).*(Hong|HK|香港)"}
  - {name: ♻️ 台湾自动, type: url-test, include-all: true, lazy: false, interval: 100, tolerance: 30, url: "https://www.gstatic.com/generate_204", filter: "(?i)Taiwan|TW|台湾"}
  
  - {name: ♻️ 日本自动, type: url-test, include-all: true, lazy: false, interval: 100, tolerance: 30, url: "https://www.gstatic.com/generate_204", filter: "(?i)Japan|JP|日本"}
