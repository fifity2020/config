  - {name: ♻️ 美国自动, type: url-test, include-all: true, lazy: false, interval: 100, tolerance: 30, url: "https://www.gstatic.com/generate_204", filter: "(?i)USA|US|美国"}
  - {name: ♻️ 自动选择, type: url-test, include-all: true, lazy: false, interval: 100, tolerance: 50, url: "https://www.gstatic.com/generate_204", filter: "^((?!(DIRECT)).)*$"}
  - {name: ♻️ 油管无广, type: url-test, include-all: true, lazy: false, interval: 100, tolerance: 50, url: "https://www.gstatic.com/generate_204", filter:"(?i)油管无广"}

  # ================= 4. 基础手动组 (底层资源) =================
  
  - {name: 🇭🇰 香港节点, type: select, include-all: true, filter: "(?i)^(?!.*3x)Hong|HK|香港"}
