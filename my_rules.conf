# my_rules.conf — Shadowrocket 自定义规则组与策略组
#
# 结构与 clash-adapter 的 my_rules.yaml 对应:
#   [Proxy Group]  : 自定义策略组, 原样注入 [Proxy Group] 段首部
#   [RuleSet <名>] : 一个命名规则集
#       policy = 策略组名          (RULE-SET 引用行的策略)
#       url = https://...           (可重复: 远端 Shadowrocket 格式列表,
#                                    构建时拉取; 单 url 且无其他输入时直接引用,
#                                    否则与 source/内联规则合并生成 rules/<名>.list)
#       source = https://...        (远端其他格式规则集, 需配 format 转换)
#       format = clash-yaml | domain-list | shadowrocket
#       其余行: 内联补充规则 (远端为主, 内联为你独有的补充; 合并时去重),
#               裸规则不带策略名, 保留 no-resolve 等 flag
# 构建时: 每个合并/转换/内联型 RuleSet 生成 rules/<名>.list,
# 主配置 [Rule] 顶端只注入一行:
#   RULE-SET,<RULES_BASE_URL>/<名>.list,<policy>
# 其中 RULES_BASE_URL 在 build_config_v4.py 顶部配置, 指向仓库 rules/ 目录的 raw 地址。

# -------------------- 自动优选与主选择组 --------------------
自动优选 = url-test, url=https://www.gstatic.com/generate_204, interval=300, tolerance=50, policy-regex-filter=(?i)(Hong|HK|香港|TW|Taiwan|台湾|Japan|JP|日本|SG|Singapore|新加坡|USA|US|美国|Germany|DE|德国|德國)
🚀 节点选择 = select, 自动优选, 🇭🇰 香港节点, 🇹🇼 台湾节点, 🇯🇵 日本节点, 🇸🇬 狮城节点, 🇺🇸 美国节点, 🇩🇪 德国节点, PROXY, DIRECT, REJECT, 🌐 其他节点

# -------------------- AI 专属策略组 --------------------
🤖 AI 优选 = url-test, url=https://www.gstatic.com/generate_204, interval=300, tolerance=50, policy-regex-filter=(?i)(Japan|JP|日本)|(?i)(TW|Taiwan|台湾|臺灣)|(?i)(Singapore|SG|新加坡|狮城)|(?i)(USA|US|United States|美国)|(?i)(Germany|DE|德国|德國)
🤖 AI 服务 = select, 🤖 AI 优选,🇺🇸 美国节点, 🇯🇵 日本节点, 🇹🇼 台湾节点, 🇸🇬 狮城节点,  🇩🇪 德国节点, 🚀 节点选择

# -------------------- 覆盖上游问题组 --------------------
# 上游的油管组首选 🚀 节点选择, 而节点选择在手机上保存的选择是 PROXY
# (伪策略, 解析成订阅默认节点, 常是播不了油管的节点), 导致默认无法播放。
# 覆盖为自动优选打头, 并把该组名加入脚本 skip_keywords 踢掉上游原组。
📹 油管视频 = select, 自动优选,🇭🇰 香港节点, 🇹🇼 台湾节点, 🇯🇵 日本节点, 🇸🇬 狮城节点, 🇺🇸 美国节点,  🇩🇪 德国节点, 🚀 节点选择, DIRECT

# -------------------- 故障转移组 --------------------
🇭🇰 香港故转 = fallback, url=https://www.gstatic.com/generate_204, interval=120, policy-regex-filter=(?i)(Hong|HK|香港)
🇹🇼 台湾故转 = fallback, url=https://www.gstatic.com/generate_204, interval=120, policy-regex-filter=(?i)(TW|Taiwan|台湾|臺灣)
🇯🇵 日本故转 = fallback, url=https://www.gstatic.com/generate_204, interval=120, policy-regex-filter=(?i)(Japan|JP|日本)
🇸🇬 狮城故转 = fallback, url=https://www.gstatic.com/generate_204, interval=120, policy-regex-filter=(?i)(Singapore|SG|新加坡|狮城)
🇺🇸 美国故转 = fallback, url=https://www.gstatic.com/generate_204, interval=120, policy-regex-filter=(?i)(USA|US|United States|美国)
🇩🇪 德国故转 = fallback, url=https://www.gstatic.com/generate_204, interval=120, policy-regex-filter=(?i)(Germany|DE|德国|德國)

# -------------------- 基础地区组 --------------------
🇭🇰 香港节点 = url-test, url=https://www.gstatic.com/generate_204, interval=600, tolerance=50, policy-regex-filter=(?i)(Hong|HK|香港)
🇹🇼 台湾节点 = url-test, url=https://www.gstatic.com/generate_204, interval=600, tolerance=50, policy-regex-filter=(?i)(TW|Taiwan|台湾|臺灣)
🇯🇵 日本节点 = url-test, url=https://www.gstatic.com/generate_204, interval=600, tolerance=50, policy-regex-filter=(?i)(Japan|JP|日本)
🇸🇬 狮城节点 = url-test, url=https://www.gstatic.com/generate_204, interval=600, tolerance=50, policy-regex-filter=(?i)(Singapore|SG|新加坡|狮城)
🇺🇸 美国节点 = url-test, url=https://www.gstatic.com/generate_204, interval=600, tolerance=50, policy-regex-filter=(?i)(USA|US|United States|美国)
🇩🇪 德国节点 = url-test, url=https://www.gstatic.com/generate_204, interval=600, tolerance=50, policy-regex-filter=(?i)(Germany|DE|德国|德國)
🌐 其他节点 = select, PROXY, DIRECT

# -------------------- 常用规则集: 远端为主, 内联为独有补充 --------------------
# 远端列表由他人维护, 构建时拉取合并; 内联行只留远端没有的补充, 合并时去重。
# 远端拉取失败时保留旧 .list; 全部失败且无旧文件时跳过该组, 不产生悬空引用。

[RuleSet ai]
policy = 🤖 AI 服务
url = https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/OpenAI/OpenAI.list
url = https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Claude/Claude.list
url = https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Gemini/Gemini.list
