# my_rules.conf — Shadowrocket 自定义规则组与策略组
#
# 结构与 clash-adapter 的 my_rules.yaml 对应:
#   [Proxy Group]  : 自定义策略组, 原样注入 [Proxy Group] 段首部
#   [RuleSet <名>] : 一个命名规则集
#       policy = 策略组名          (RULE-SET 引用行的策略)
#       url = https://...           (可选: 已有远端规则集, 直接引用, 不生成 .list)
#       其余行: 裸规则, 不带策略名 (策略名由 policy 统一指定),
#               保留 no-resolve 等 flag
# 构建时: 每个内联 RuleSet 生成 rules/<名>.list,
# 主配置 [Rule] 顶端只注入一行:
#   RULE-SET,<RULES_BASE_URL>/<名>.list,<policy>
# 其中 RULES_BASE_URL 在 build_config_v2.py 顶部配置, 指向仓库 rules/ 目录的 raw 地址。

[Proxy Group]
# -------------------- 自动优选与主选择组 --------------------
自动优选 = url-test, url=https://www.gstatic.com/generate_204, interval=300, tolerance=50, policy-regex-filter=(?i)(Hong|HK|香港|TW|Taiwan|台湾|Japan|JP|日本|SG|Singapore|新加坡|USA|US|美国)
🚀 节点选择 = select, 自动优选, 🇭🇰 香港节点, 🇹🇼 台湾节点, 🇯🇵 日本节点, 🇸🇬 狮城节点, 🇺🇸 美国节点, PROXY, DIRECT, REJECT, 🌐 其他节点

# -------------------- AI 专属策略组 --------------------
🤖 AI 优选 = url-test, url=https://www.gstatic.com/generate_204, interval=300, tolerance=50, policy-regex-filter=(?i)(Japan|JP|日本)|(?i)(TW|Taiwan|台湾|臺灣)|(?i)(Singapore|SG|新加坡|狮城)|(?i)(USA|US|United States|美国)
🤖 AI 服务 = select, 🤖 AI 优选, 🇯🇵 日本节点, 🇹🇼 台湾节点, 🇸🇬 狮城节点, 🇺🇸 美国节点, 🚀 节点选择

# -------------------- 故障转移组 --------------------
🇭🇰 香港故转 = fallback, url=https://www.gstatic.com/generate_204, interval=120, policy-regex-filter=(?i)(Hong|HK|香港)
🇹🇼 台湾故转 = fallback, url=https://www.gstatic.com/generate_204, interval=120, policy-regex-filter=(?i)(TW|Taiwan|台湾|臺灣)
🇯🇵 日本故转 = fallback, url=https://www.gstatic.com/generate_204, interval=120, policy-regex-filter=(?i)(Japan|JP|日本)
🇸🇬 狮城故转 = fallback, url=https://www.gstatic.com/generate_204, interval=120, policy-regex-filter=(?i)(Singapore|SG|新加坡|狮城)
🇺🇸 美国故转 = fallback, url=https://www.gstatic.com/generate_204, interval=120, policy-regex-filter=(?i)(USA|US|United States|美国)

# -------------------- 基础地区组 --------------------
🇭🇰 香港节点 = url-test, url=https://www.gstatic.com/generate_204, interval=600, tolerance=50, policy-regex-filter=(?i)(Hong|HK|香港)
🇹🇼 台湾节点 = url-test, url=https://www.gstatic.com/generate_204, interval=600, tolerance=50, policy-regex-filter=(?i)(TW|Taiwan|台湾|臺灣)
🇯🇵 日本节点 = url-test, url=https://www.gstatic.com/generate_204, interval=600, tolerance=50, policy-regex-filter=(?i)(Japan|JP|日本)
🇸🇬 狮城节点 = url-test, url=https://www.gstatic.com/generate_204, interval=600, tolerance=50, policy-regex-filter=(?i)(Singapore|SG|新加坡|狮城)
🇺🇸 美国节点 = url-test, url=https://www.gstatic.com/generate_204, interval=600, tolerance=50, policy-regex-filter=(?i)(USA|US|United States|美国)
🌐 其他节点 = select, PROXY, DIRECT

