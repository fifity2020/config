# ---------------- 远端规则集引用示例 (取消注释启用) ----------------
# 与 clash-adapter 的 rule-providers 对应: Clash 格式的源不能直接 RULE-SET
# 引用, 构建时由 source + format 拉取并转换, 生成 rules/<名>.list 再引用。
# format: clash-yaml (payload 列表) / domain-list (纯域名列表) / shadowrocket
# 拉取失败时保留旧 .list; 无旧文件则跳过该组, 不产生悬空引用。
# 注意: ysp 源目前返回 Cloudflare 验证页, 拉不到, 需等源站恢复。
# 策略组按 clash-adapter 侧的路由填写, 按需改。

